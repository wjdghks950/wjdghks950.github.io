<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.data.main_info.name | escape }}</title>
  <meta name="description" content="Jeonghwan Kim — Ph.D. candidate at UIUC researching multimodal foundation models, fine-grained visual understanding, and embodied AI.">
  <meta name="author" content="{{ site.data.main_info.name | escape }}">
  <meta name="theme-color" content="#f8f6f0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Caslon+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/libs/external/font-awesome-4.7.0/css/font-awesome.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/libs/custom/editorial.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.data.main_info.name }}</a>
      <nav aria-label="Main navigation">
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a href="{{ '/#publications' | relative_url }}">Research</a>
        <a href="{{ '/#experience' | relative_url }}">Experience</a>
        <a class="nav-cv" href="{{ site.data.main_info.cv | relative_url }}">CV <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>
  <main class="shell" id="main">
    {{ content }}
  </main>
  <footer class="shell site-footer">
    <div><a class="wordmark" href="{{ '/' | relative_url }}">{{ site.data.main_info.name }}</a><p>Perception. Knowledge. Action.</p></div>
    <div class="footer-links">
      <a href="{{ site.data.main_info.github }}">GitHub</a>
      <a href="{{ site.data.main_info.linkedin }}">LinkedIn</a>
      <a href="{{ site.data.main_info.semantic_scholar }}">Semantic Scholar</a>
      <a href="mailto:{{ site.data.main_info.email | replace: ' [AT] ', '@' }}">Email <span aria-hidden="true">↗</span></a>
    </div>
    <p class="credit">Originally based on <a href="https://web.media.mit.edu/~msaveski/">Martin Saveski’s template</a>.</p>
  </footer>
  {% include google_analytics.html %}
</body>
</html>
